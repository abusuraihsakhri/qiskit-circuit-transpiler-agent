[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-circuit-transpiler-engine"
version = "2.0.0"
description = "Quantum Circuit Transpilation & CNOT Gate Optimizer Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
qiskit-circuit-transpiler-engine = "qiskit_transpiler.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/qiskit-circuit-transpiler-engine"
Repository = "https://github.com/abusuraihsakhri/qiskit-circuit-transpiler-engine.git"
