[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-circuit-transpiler-engine"
version = "2.0.0"
description = "Quantum Circuit Transpilation & CNOT Gate Optimizer Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
qiskit-circuit-transpiler-engine = "qiskit_transpiler.cli:main"
qiskit-circuit-transpiler-agent = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/qiskit-circuit-transpiler-agent"
Repository = "https://github.com/abusuraihsakhri/qiskit-circuit-transpiler-agent.git"
